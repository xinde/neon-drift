<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Drift</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a12;overflow:hidden}
canvas{display:block;touch-action:none;-webkit-touch-callout:none}
/* 启动画面覆盖在 canvas 之上 */
#start-screen{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
/* 标题玻璃板 */
#start-screen h1{
  color:#00FFFF;font-size:clamp(2em,6vw,3.5em);
  text-shadow:0 0 20px #00FFFF,0 0 40px #00FFFF;
  margin-bottom:16px;
  background:rgba(10,10,18,0.6);
  padding:12px 32px;
  border-radius:8px;
  backdrop-filter:blur(8px);
}
/* 副标题 */
#start-screen p{
  color:#888;font-size:clamp(0.9em,2vw,1.2em);
  margin-bottom:32px;text-align:center;
  background:rgba(10,10,18,0.5);
  padding:6px 20px;
  border-radius:4px;
}
/* 开始按钮 */
#start-btn{
  background:linear-gradient(135deg,#00FFFF,#FF00FF);
  border:none;padding:14px 40px;font-size:1.1em;
  color:#0a0a12;border-radius:30px;cursor:pointer;
  box-shadow:0 0 20px rgba(0,255,255,0.4);
  margin-bottom:24px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
/* 提示文字 */
#start-screen .tips{
  color:#a5aec3;font-size:0.85em;line-height:1.6;text-align:center;
}
#pulse-btn{
  position:fixed;z-index:5;left:max(18px,env(safe-area-inset-left));
  bottom:max(22px,env(safe-area-inset-bottom));width:66px;height:66px;
  border:1px solid #48d4e3;border-radius:50%;background:#0b2537e6;
  color:#bafaff;font:bold 15px system-ui;touch-action:none;
}
</style>
</head>
<body>
<div id="start-screen">
<h1>NEON DRIFT</h1>
<p>金色晶体能为冲击波充能。收齐后，驶入绿色光门</p>

<button id="start-btn" disabled>开始游戏</button>
<div class="tips">
电脑用 WASD 或方向键移动，按空格清除附近暗礁。<br>手机可倾斜或拖动屏幕转向，点冲击波按钮清障。
</div>
</div>

<button id="pulse-btn" aria-label="释放冲击波" hidden>冲击波</button>

<!-- LittleJS 引擎 -->
<script src="littlejs.js"></script>
<!-- 游戏模块 -->
<script src="sensor.js"></script>
<script src="particles.js"></script>
<script src="levels/level1.js"></script>
<script src="levels/level2.js"></script>
<script src="levels/level3.js"></script>
<script src="game.js"></script>
<script>
// 阻止 LittleJS 全局 touch handler 拦截启动画面的触摸事件
// LittleJS 在 document 级别注册了 touchstart/touchmove/touchend，
// 并调用 e.preventDefault() 阻止 click 合成。
// stopPropagation 确保启动画面上的触摸不冒泡到 document，
// 从而让浏览器正常合成 click 事件（iOS 权限请求需要 click 上下文）。
var startScreen = document.getElementById('start-screen');
startScreen.addEventListener('touchstart', function(e) { e.stopPropagation(); }, { passive: true });
startScreen.addEventListener('touchmove', function(e) { e.stopPropagation(); }, { passive: true });
startScreen.addEventListener('touchend', function(e) { e.stopPropagation(); }, { passive: true });

document.getElementById('start-btn').addEventListener('click', function(e) {
  e.preventDefault();
  startScreen.style.display = 'none';
  window.startGame();
});
</script>
</body>
</html>
